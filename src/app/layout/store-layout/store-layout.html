<header class="navbar">
  <a routerLink="/" class="logo">RedSport</a>

  <nav class="nav-links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/catalogo" routerLinkActive="active">Catálogo</a>
  </nav>

  <div class="nav-actions">
    <button
      type="button"
      class="cart-btn"
      [class.active]="cartStore.drawerOpen()"
      (click)="onCartClick()"
      aria-label="Ver carrito"
    >
      🛒
      @if (cartStore.totalQuantity() > 0) {
        <span class="badge">{{ cartStore.totalQuantity() }}</span>
      }
    </button>
    <button class="account-btn" type="button">Mi cuenta</button>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="footer">
  <p>RedSport — Viste tu esfuerzo 💪</p>
</footer>

<app-cart-drawer />
