<header class="navbar">
  <a routerLink="/" class="logo">RedSport</a>

  <nav class="nav-links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/catalogo" routerLinkActive="active">Catálogo</a>
    <a routerLink="/promos" routerLinkActive="active" class="promos-link">Promos</a>
  </nav>

  <div class="nav-actions">
    <button
      type="button"
      class="cart-btn"
      [class.active]="cartStore.drawerOpen()"
      (click)="onCartClick()"
      aria-label="Ver carrito"
    >
      🛒
      @if (cartStore.totalQuantity() > 0) {
        <span class="badge">{{ cartStore.totalQuantity() }}</span>
      }
    </button>
    @if (authStore.isAuthenticated()) {
      <a routerLink="/cuenta" routerLinkActive="active" class="account-btn">Mi cuenta</a>
    } @else {
      <button class="login-btn" type="button" (click)="authStore.openModal('login')">
        Iniciar sesión
      </button>
      <button class="register-btn" type="button" (click)="authStore.openModal('register')">
        Registrarse
      </button>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="footer">
  <p>RedSport — Viste tu esfuerzo 💪</p>
</footer>

<app-cart-drawer />

<!-- Auth overlay: lives in the layout so it can open over ANY page -->
<app-auth-modal />
