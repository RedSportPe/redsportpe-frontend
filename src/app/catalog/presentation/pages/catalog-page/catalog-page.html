<section class="catalog">
  <div class="catalog-header">
    <h1>Catálogo</h1>

    <div class="controls">
      <label class="control">
        Ordenar por:
        <select (change)="onSortChange($event)">
          @for (option of sortOptions; track option[0]) {
            <option [value]="option[0]" [selected]="option[0] === store.sortOption()">
              {{ option[1] }}
            </option>
          }
        </select>
      </label>

      <label class="control">
        Filtrar por:
        <select (change)="onCategoryChange($event)">
          <option value="all" [selected]="store.categoryFilter() === 'all'">Todos</option>
          @for (category of store.categories(); track category) {
            <option [value]="category" [selected]="category === store.categoryFilter()">
              {{ category }}
            </option>
          }
        </select>
      </label>

      <label class="control">
        Para:
        <select (change)="onGenderChange($event)">
          @for (option of genderOptions; track option[0]) {
            <option [value]="option[0]" [selected]="option[0] === store.genderFilter()">
              {{ option[1] }}
            </option>
          }
        </select>
      </label>
    </div>
  </div>

  @if (store.loading()) {
    <p>Cargando productos...</p>
  } @else {
    <div class="grid">
      @for (product of store.products(); track product.id) {
        <app-product-card [product]="product" />
      } @empty {
        <p class="no-results">No hay productos que coincidan con los filtros.</p>
      }
    </div>
  }
</section>
